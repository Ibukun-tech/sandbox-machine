name: Push to my github repo

on:
    push:
        branches: ["dev"]
 
jobs:
    deploy:
        runs-on: ubuntu-latest
    
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4
    
          - name: Set up Node.js and Yarn
            run: |
              corepack enable
              corepack prepare yarn@4.9.1 --activate
              yarn --version
    